[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmis"
version = "0.1.0"
description = "Conversational Memory Intelligence System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "temporalio>=1.7.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "python-dotenv>=1.0", "PyJWT>=2.8"]
embeddings = ["sentence-transformers>=3.0"]
retrieval = ["sentence-transformers>=3.0"]
temporal = ["temporalio>=1.7.0"]
redis = ["redis>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires Postgres (DATABASE_URL)",
    "redis: requires Redis (REDIS_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
